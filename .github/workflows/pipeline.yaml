name: Java Maven CI Pipeline

on:
  push:
    branches: [ develop,main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    name: Compile
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile source code
        run: mvn clean compile
        working-directory: sts_check_Backend

  test:
    name: Test
    runs-on: windows-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests
        run: mvn test
        working-directory: sts_check_Backend

  package:
    name: Package
    runs-on: windows-latest
    needs: [ build, test ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package application
        run: mvn package
        working-directory: sts_check_Backend

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: sts_check_Backend/target/*.jar
